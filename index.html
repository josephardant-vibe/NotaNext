<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notanext — Lecture de notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-icons" id="bg-icons" aria-hidden="true"></div>

  <nav class="nav">
    <button type="button" id="tab-ex" class="on">S'exercer</button>
    <button type="button" id="tab-learn">Apprendre</button>
  </nav>

  <div class="shell" id="view-ex">
    <div class="panel" id="ex-panel">
      <div id="ex-grid">
        <div class="grid-head">
          <h1>S'exercer</h1>
          <span class="hint">Choisis un exercice</span>
        </div>
        <div class="grid" id="card-grid"></div>
      </div>
      <div class="ex-page" id="ex-page" hidden></div>
    </div>
  </div>

  <div class="shell" id="view-learn" hidden>
    <div class="panel wide">
      <div class="learn-layout">
        <div class="learn-left">
          <h2>Les clés</h2>
          <select id="learn-clef" aria-label="Choisir une clé"></select>
          <p class="learn-hint">Clique une note pour l'entendre.</p>
          <div class="learn-staff">
            <svg id="learn-staff" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Portée annotée"></svg>
          </div>
        </div>
        <div class="faq">
          <h3>FAQ</h3>
          <div id="faq-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/notes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/staff.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
