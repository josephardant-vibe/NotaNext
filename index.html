<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notanext — Lecture de notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <header>
      <h1>Notanext</h1>
      <div class="score-card">
        <span class="score-label">Score</span>
        <span id="score" class="score-value">0</span>
        <div class="streak-track"><div id="streak-fill" class="streak-fill"></div></div>
        <span class="streak-label">Série <b id="streak">0</b></span>
      </div>
    </header>

    <main>
      <div class="staff-wrap">
        <svg id="staff" viewBox="0 0 300 200" role="img" aria-label="Portée musicale en clé de sol"></svg>
      </div>

      <p id="feedback" class="feedback" aria-live="polite">&nbsp;</p>

      <div class="answers" id="answers"></div>
    </main>
  </div>

  <script src="js/notes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/staff.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
